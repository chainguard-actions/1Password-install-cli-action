name: Test basic usage - install latest 1Password CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install 1Password CLI (latest)
        id: install
        uses: .
      - name: Assert op is installed and executable
        run: |
          echo "Checking if op is available..."
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          echo "op found at: $(command -v op)"
          echo "PASS: op is installed"
      - name: Assert op version output
        run: |
          echo "Running: op --version"
          VERSION_OUTPUT=$(op --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: op --version returned empty output"
            exit 1
          fi
          echo "PASS: op --version returned: $VERSION_OUTPUT"
