name: Test basic usage (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert op CLI is installed
        run: |
          echo "Checking if op CLI is installed..."
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          echo "op version: $(op --version)"
          echo "PASS: op CLI is installed"
