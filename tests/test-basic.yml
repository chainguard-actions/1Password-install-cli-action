name: Test basic usage - install latest 1Password CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
      - name: Assert op is installed
        run: |
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          echo "PASS: 'op' is installed at $(command -v op)"
      - name: Assert op version output
        run: |
          VERSION_OUTPUT=$(op --version 2>&1 || true)
          echo "op version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: 'op --version' produced no output"
            exit 1
          fi
          echo "PASS: op version is $VERSION_OUTPUT"
