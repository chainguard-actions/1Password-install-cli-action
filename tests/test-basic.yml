name: Test basic usage - install latest 1Password CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert op CLI is installed
        run: |
          echo "Checking if op CLI is installed..."
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          echo "PASS: 'op' command found at $(command -v op)"
      - name: Assert op CLI is executable and returns version
        run: |
          echo "Checking op CLI version output..."
          OP_VERSION="$(op --version 2>&1 || true)"
          echo "op version: $OP_VERSION"
          if [ -z "$OP_VERSION" ]; then
            echo "FAIL: 'op --version' returned empty output"
            exit 1
          fi
          echo "PASS: op CLI returned version: $OP_VERSION"
