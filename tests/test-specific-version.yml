name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.24.0"
      - name: Assert op CLI is installed with correct version
        run: |
          echo "Checking if op CLI is installed..."
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          INSTALLED_VERSION="$(op --version)"
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "2.24.0" ]; then
            echo "FAIL: expected version '2.24.0' but got '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS: op CLI version $INSTALLED_VERSION is installed"
