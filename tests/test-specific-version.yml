name: Test specific version - install pinned 1Password CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install 1Password CLI (specific version)
        id: install
        uses: .
        with:
          version: "2.30.0"
      - name: Assert op is installed and executable
        run: |
          echo "Checking if op is available..."
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          echo "op found at: $(command -v op)"
          echo "PASS: op is installed"
      - name: Assert op version matches requested version
        run: |
          EXPECTED="2.30.0"
          ACTUAL=$(op --version 2>&1 | head -n1 | tr -d '[:space:]')
          echo "Expected version: $EXPECTED"
          echo "Actual version:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: op version matches expected '$EXPECTED'"
