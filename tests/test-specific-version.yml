name: Test specific version - install pinned 1Password CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
        with:
          version: "2.30.0"
      - name: Assert op is installed
        run: |
          if ! command -v op &>/dev/null; then
            echo "FAIL: 'op' command not found in PATH"
            exit 1
          fi
          echo "PASS: 'op' is installed at $(command -v op)"
      - name: Assert op version matches requested version
        run: |
          INSTALLED=$(op --version 2>&1 | tr -d '[:space:]')
          echo "installed version: $INSTALLED"
          EXPECTED="2.30.0"
          if [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED' but got '$INSTALLED'"
            exit 1
          fi
          echo "PASS: installed version matches expected '$EXPECTED'"
