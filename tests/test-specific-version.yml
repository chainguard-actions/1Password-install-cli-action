name: Test install specific 1Password CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: "2.30.0"

      - name: Assert op binary is available
        run: |
          echo "Checking that 'op' is on PATH..."
          if ! command -v op >/dev/null 2>&1; then
            echo "FAIL: 'op' binary not found on PATH"
            exit 1
          fi
          echo "PASS: 'op' binary found at $(command -v op)"

      - name: Assert op version matches requested version
        run: |
          EXPECTED="2.30.0"
          ACTUAL=$(op --version)
          echo "actual version: $ACTUAL"
          echo "expected version: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: op version matches expected $EXPECTED"
